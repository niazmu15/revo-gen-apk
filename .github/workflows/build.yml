name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract ZIP Project
        run: |
          echo "Finding and extracting ZIP file..."
          # রিপোজিটরির ভেতরে থাকা যেকোনো জিপ ফাইল নিজে থেকেই খুঁজে বের করে আনজিপ করবে
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "Found zip: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d project_source
          ls -la project_source

      - name: Find Project Root Directory
        id: find_dir
        run: |
          if [ -f "project_source/gradlew" ]; then
            echo "path=project_source" >> $GITHUB_OUTPUT
            echo "Found gradlew in root of extracted folder."
          else
            SUBDIR=$(find project_source -maxdepth 2 -name "gradlew" -exec dirname {} \;)
            echo "path=$SUBDIR" >> $GITHUB_OUTPUT
            echo "Found gradlew in: $SUBDIR"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ${{ steps.find_dir.outputs.path }}/gradlew

      - name: Build APK with Gradle
        run: |
          cd ${{ steps.find_dir.outputs.path }}
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.find_dir.outputs.path }}/app/build/outputs/apk/debug/*.apk

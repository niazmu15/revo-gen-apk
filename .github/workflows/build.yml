name: Build APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Manual trigger korar jonno

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Repository checkout kora
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Java Environment Setup kora (Android build-er jonno JDK 17 ba 11 proyojon hoy)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    # 3. ZIP File Extract kora
    # Mone rakhben, apnar ZIP file-ti jodi repository-te thake tahole tar path thik korte hobe.
    - name: Extract ZIP Project
      run: |
        # 'project.zip' ke apnar zip file-er name-e poriborton kore din
        unzip project.zip -d extracted_project/

    # 4. Gradle Wrapper-ke executable kora (Linux/Mac environment-er jonno)
    - name: Make Gradle wrapper executable
      run: |
        cd extracted_project
        chmod +x gradlew

    # 5. Debug APK Build kora
    - name: Build APK with Gradle
      run: |
        cd extracted_project
        ./gradlew assembleDebug

    # 6. Build kora APK-ti Artifact hisebe save kora (download korar jonno)
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: extracted_project/app/build/outputs/apk/debug/app-debug.apk

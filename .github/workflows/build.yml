name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract ZIP Project
        run: |
          echo "Unzipping project source..."
          unzip -o Gen_Engine_V1_Latest_Source.zip -d extracted_project
          ls -la extracted_project

      - name: Make Gradle wrapper executable
        run: chmod +x extracted_project/gradlew

      - name: Build APK with Gradle
        run: |
          cd extracted_project
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: extracted_project/app/build/outputs/apk/debug/*.apk

    - name: Unzip Source Code
      run: |
        unzip -o Gen_Engine_V1_Latest_Source.zip -d .
        EXTRACTED_DIR=$(find . -maxdepth 1 -type d -name "Gen_Engine_V1_Latest_Source*" | head -n 1)
        if [ -n "$EXTRACTED_DIR" ] && [ "$EXTRACTED_DIR" != "." ]; then
          cp -rn "$EXTRACTED_DIR"/* . || true
        fi

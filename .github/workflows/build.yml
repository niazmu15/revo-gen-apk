name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Source Code
      run: |
        unzip -o Gen_Engine_V1_Latest_Source.zip -d .
        # Check and move files if unzipped in subfolder
        EXTRACTED_DIR=$(find . -maxdepth 1 -type d -name "Gen_Engine_V1_Latest_Source*" | head -n 1)
        if [ -n "$EXTRACTED_DIR" ] && [ "$EXTRACTED_DIR" != "." ]; then
          cp -rn "$EXTRACTED_DIR"/* . || true
        fi

    - name: Update App Name, Package & Logo
      run: |
        # Change App Name to GenCore4
        sed -i 's/<string name="app_name".*>.*<\/string>/<string name="app_name">GenCore4<\/string>/g' app/src/main/res/values/strings.xml || true
        
        # Change Package Name
        sed -i 's/applicationId .*/applicationId "com.gencore4.app"/g' app/build.gradle || true
        
        # Apply the new Logo
        if [ -f logo.png ]; then
          cp logo.png app/src/main/res/mipmap-mdpi/ic_launcher.png || true
          cp logo.png app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          cp logo.png app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          cp logo.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          cp logo.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
          cp logo.png app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml || true
        fi

    - name: Fix Deprecated Java/Gradle Flags
      run: |
        if [ -f gradle.properties ]; then
          sed -i 's/-XX:MaxPermSize=[^ ]*//g' gradle.properties
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk

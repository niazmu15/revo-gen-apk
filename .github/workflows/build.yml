name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract ZIP Project
        run: |
          echo "Extracting ZIP file..."
          # জিপ ফাইলের ভেতরে যদি আলাদা ফোল্ডার থাকে, তবে তা হ্যান্ডেল করার জন্য -q ব্যবহার করা হয়েছে
          unzip -o Gen_Engine_V1_Latest_Source.zip -d project_source
          ls -la project_source

      - name: Find Project Root Directory
        id: find_dir
        run: |
          # জিপ ফাইলের ভেতরে মেইন প্রজেক্ট ফোল্ডার বা সরাসরি gradlew কোথায় আছে তা খুঁজে বের করা
          if [ -f "project_source/gradlew" ]; then
            echo "path=project_source" >> $GITHUB_OUTPUT
            echo "Found gradlew in root of extracted folder."
          else
            # যদি জিপের ভেতরে আরেকটি সাব-ফোল্ডার থাকে
            SUBDIR=$(find project_source -maxdepth 2 -name "gradlew" -exec dirname {} \;)
            echo "path=$SUBDIR" >> $GITHUB_OUTPUT
            echo "Found gradlew in: $SUBDIR"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ${{ steps.find_dir.outputs.path }}/gradlew

      - name: Build APK with Gradle
        run: |
          cd ${{ steps.find_dir.outputs.path }}
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.find_dir.outputs.path }}/app/build/outputs/apk/debug/*.apk
